<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>nodeRels</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="icons/icon32.png" width="20" height="20" alt="" />
      <span class="brand">nodeRels</span>
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="clip" role="tab" aria-selected="true">Clip</button>
        <button class="tab-btn" data-tab="chat" role="tab" aria-selected="false">Chat</button>
      </div>
      <button id="sign-out" class="icon-btn hidden" title="Sign out" aria-label="Sign out">⏻</button>
      <button id="settings-toggle" class="icon-btn" title="Backend settings" aria-label="Settings">⚙</button>
    </header>

    <section id="settings-panel" class="settings-panel hidden">
      <label for="backend-url">Backend URL</label>
      <div class="row">
        <input id="backend-url" type="text" placeholder="http://127.0.0.1:8000" />
      </div>
      <label for="auth-url">Supabase project URL</label>
      <input id="auth-url" type="text" placeholder="https://xxxx.supabase.co" />
      <label for="auth-key">Supabase anon key</label>
      <input id="auth-key" type="text" placeholder="publishable anon key" />
      <div class="row">
        <button id="settings-save" class="btn btn-secondary">Save</button>
      </div>
      <p id="settings-status" class="hint"></p>
      <p class="hint">
        Leave the Supabase fields blank for a local backend running with
        AUTH_DISABLED=true.
      </p>
    </section>

    <!-- Shown only when a Supabase project is configured and nobody is signed
         in. A hosted backend answers 401 to everything until then. -->
    <section id="panel-signin" class="panel hidden">
      <p class="hint">Sign in to your nodeRels knowledge base.</p>
      <form id="signin-form">
        <label class="field-label" for="signin-email">Email</label>
        <input id="signin-email" type="email" autocomplete="username" />
        <label class="field-label" for="signin-password">Password</label>
        <input id="signin-password" type="password" autocomplete="current-password" />
        <button type="submit" class="btn">Sign in</button>
      </form>
      <p id="signin-status" class="status"></p>
    </section>

    <section id="panel-clip" class="panel">
      <div class="page-info">
        <p id="page-title" class="page-title">—</p>
        <p id="page-url" class="page-url">—</p>
      </div>
      <div class="actions">
        <button id="clip-page" class="btn">Clip this page</button>
        <button id="clip-selection" class="btn btn-secondary">Add selected text</button>
      </div>
      <p id="clip-status" class="status"></p>
    </section>

    <section id="panel-preview" class="panel hidden">
      <label class="field-label" for="preview-title">Title</label>
      <input id="preview-title" type="text" />
      <p id="preview-meta" class="page-url">—</p>
      <textarea
        id="preview-body"
        class="preview-body"
        readonly
        spellcheck="false"
        aria-label="Extracted content"
      ></textarea>
      <div class="row">
        <button id="preview-edit" class="btn btn-secondary" aria-pressed="false">Edit</button>
        <button id="preview-back" class="btn btn-secondary">Back</button>
        <button id="preview-add" class="btn">Add to Knowledge Base</button>
      </div>
      <p id="preview-status" class="status"></p>
    </section>

    <section id="panel-chat" class="panel hidden">
      <div id="chat-log" class="chat-log">
        <p class="hint">Ask a question about your knowledge base.</p>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Ask a question…" autocomplete="off" />
        <button type="submit" class="btn">Send</button>
      </form>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
